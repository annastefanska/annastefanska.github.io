media:
- name: blog_images
  label: Zdjęcia bloga
  input: images/blog
  output: /images/blog
  rename: safe
- name: site_images
  label: Obrazy strony
  input: images
  output: /images
  rename: safe
settings:
  content:
    merge: true
content:
- name: blog
  label: Wpisy na blogu
  type: collection
  path: _posts
  format: yaml-frontmatter
  filename: '{year}-{month}-{day}-{title}.md'
  view:
    primary: title
    fields:
    - title
    - date
    - category
    - published
    sort:
    - date
    - title
    default:
      sort: date
      order: desc
  operations:
    create: true
    rename: false
    delete: true
  fields:
  - name: title
    label: Tytuł artykułu
    type: string
    required: true
  - name: date
    label: Data publikacji
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: category
    label: Kategoria / temat
    type: string
  - name: summary
    label: Krótki opis na liście wpisów
    type: text
  - name: image
    label: Zdjęcie główne
    type: image
    options:
      media: blog_images
      rename: safe
  - name: published
    label: Opublikowany
    type: boolean
    default: true
  - name: featured_archive
    label: Wyróżniony wpis w archiwum
    type: boolean
    default: false
  - name: body
    label: Treść artykułu
    type: rich-text
    required: true
    options:
      format: markdown
      switcher: true
      rename: safe
      media: blog_images
