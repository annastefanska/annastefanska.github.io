
media:
  input: images/blog
  output: /images/blog
  rename: safe

content:
  - name: blog
    label: Wpisy na blogu
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{title}.md"
    view:
      primary: title
      fields: [title, date, category, published]
      sort: [date, title]
      default:
        sort: date
        order: desc
    operations:
      create: true
      rename: false
      delete: true
    fields:
      - name: title
        label: Tytuł artykułu
        type: string
        required: true
      - name: date
        label: Data publikacji
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: Kategoria / temat
        type: string
        description: Np. Emocje, Dzieci, Relacje, Trauma
      - name: summary
        label: Krótki opis na liście wpisów
        type: text
        required: true
      - name: image
        label: Zdjęcie główne
        type: image
        options:
          rename: safe
      - name: published
        label: Opublikowany
        type: boolean
        default: true
      - name: body
        label: Treść artykułu
        type: rich-text
        required: true
        options:
          format: markdown
          rename: safe
          switcher: true
