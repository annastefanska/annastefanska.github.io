audience_eyebrow: Dla kogo?
audience_title: Dla kogo jest Biblioteka Czułości?
audience_paragraphs:
- Biblioteka Czułości powstała z myślą o osobach, które chcą rozwijać swoją świadomość, lepiej rozumieć własne emocje oraz
  korzystać z materiałów wspierających samopoznanie i rozwój.
- Znajdziesz tutaj zarówno bezpłatne materiały, jak i rozbudowane e-booki, karty pracy oraz kursy online, które będą stopniowo
  pojawiać się na stronie.
payment_eyebrow: Płatne materiały
payment_title: Jak opłacić wybrany materiał?
payment_lead: Jeśli wybierasz e-book lub karty pracy, skorzystaj z danych poniżej. W tytule przelewu wpisz nazwę zamawianego
  materiału.
