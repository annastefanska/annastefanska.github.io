services_title: W czym mogę Ci towarzyszyć?
services_lead: Każde spotkanie jest przestrzenią pełną uważności, szacunku i bezpieczeństwa. Wspólnie poszukamy drogi do lepszego
  zrozumienia siebie, odzyskania równowagi oraz większego spokoju.
services:
- label: 01 / WSPARCIE
  title: Konsultacje psychologiczne
  body_html: <p>Wsparcie w sytuacjach kryzysowych, trudnościach emocjonalnych, przewlekłym stresie, lęku oraz budowaniu poczucia
    własnej wartości.</p>
- label: 02 / WSPARCIE
  title: Psychotraumatologia
  body_html: <p>Pomoc osobom po doświadczeniach traumatycznych, przemocy psychicznej, stracie oraz długotrwałym stresie.</p>
- label: 03 / WSPARCIE
  title: Psychoonkologia
  body_html: <p>Wsparcie psychologiczne dla osób chorujących onkologicznie oraz ich rodzin. Pomoc w odnalezieniu siły i równowagi
    na każdym etapie leczenia.</p>
- label: 04 / WSPARCIE
  title: Muzykoterapia
  body_html: <p>Wykorzystanie muzyki, uważności oraz elementów pracy z ciałem w celu regulacji emocji i redukcji napięcia.</p>
- label: 05 / SPOTKANIA GRUPOWE
  title: Warsztaty
  body_html: <p>Spotkania dla:</p><ul><li>rodziców</li><li>nauczycieli</li><li>specjalistów</li><li>dzieci i młodzieży</li><li>grup
    wsparcia</li></ul>
- label: 06 / TEMATYKA
  title: Tematy warsztatów
  body_html: <ul><li>stres i wypalenie</li><li>regulacja emocji</li><li>komunikacja</li><li>odporność psychiczna</li><li>poczucie
    własnej wartości</li><li>psychoedukacja</li></ul>
