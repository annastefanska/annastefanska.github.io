  - tag: Karty  Małe światy. Wielkie emocje. Do pracy z dziećmi i młodzieżą.
    title: Małe światy. Wielkie emocje.
    description: >-
      Przestrzeń Czułości


      Małe światy. Wielkie emocje.


      48 autorskich kart psychologicznych dla dzieci i młodzieży


      Każda wielka historia zaczyna się od małego pomysłu. Nasza zaczęła się od
      dziecięcej wyobraźni, ciekawości i potrzeby opowiadania o tym, co dzieje
      się w środku.


      Przedstawiam wyjątkowy zestaw 48 autorskich kart psychologicznych, który
      powstał przy współudziale dzieci, z którymi pracuję. To właśnie ich
      pomysły, inspiracje, ulubieni bohaterowie i pytania stały się częścią tej
      kolekcji.


      Każda karta przedstawia niezwykłego bohatera i zawiera krótkie pytanie
      refleksyjne, które zaprasza dziecko do rozmowy o sobie, swoich emocjach,
      potrzebach, marzeniach i relacjach z innymi.


      DO CZEGO SŁUŻĄ KARTY?


      • pomagają rozpoznawać i nazywać emocje;

      • wspierają rozmowę o przeżyciach i trudnościach;

      • rozwijają samoświadomość, empatię i umiejętność komunikowania potrzeb;

      • wzmacniają poczucie własnej wartości i sprawczości;

      • pomagają budować relacje i poczucie bezpieczeństwa.


      Karty mogą być wykorzystywane podczas konsultacji psychologicznych, zajęć
      indywidualnych i grupowych, warsztatów psychoedukacyjnych, a także w domu,
      we wspólnym czasie z dzieckiem.


      To zaproszenie do rozmowy, odkrywania siebie i budowania relacji.


      Bo czasami jedno proste pytanie otwiera drzwi do bardzo ważnej rozmowy.


      ❤️ Przestrzeń Czułości. Małe światy. Wielkie emocje.


      Autorka projektu: Anna Stefańska

      Psycholog | Psychotraumatolog | Psychoonkolog


      Zestaw obejmuje 48 kart.


      Zapraszam do zakupu. W sprawie zamówienia i szczegółów proszę o kontakt.
