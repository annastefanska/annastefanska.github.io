welcome_eyebrow: Witaj w Przestrzeni Czułości
welcome_title: Cieszę się, że tu jesteś
welcome_paragraphs:
- Niezależnie od tego, z czym dziś przychodzisz, wierzę, że każdy człowiek zasługuje na relację opartą na bezpieczeństwie,
  uważności i autentycznej obecności.
- Przestrzeń Czułości powstała z myślą o osobach, które chcą lepiej zrozumieć siebie, odzyskać spokój i odnaleźć drogę do
  życia zgodnego z własnymi wartościami.
