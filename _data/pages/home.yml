meta_description: Przestrzeń Czułości. Anna Stefańska, psycholog. Bezpieczna przestrzeń do rozmowy, zrozumienia i odzyskiwania
  równowagi.
meta_title: Strona główna
title: Każdy człowiek potrzebuje miejsca, w którym może bezpiecznie odnaleźć drogę do siebie.
lead: Witaj w Przestrzeni Czułości. To miejsce stworzone z myślą o osobach, które pragną zatrzymać się, odnaleźć wewnętrzny
  spokój i z życzliwością spojrzeć na własną historię.
button_contact: Umów pierwsze spotkanie
